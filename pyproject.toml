[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "jarvis-desktop-pt"
version = "0.1.0"
description = "Assistente pessoal Windows com voz local e Codex"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi==0.115.12", "uvicorn==0.34.2", "httpx==0.28.1",
  "pydantic==2.11.5", "psutil==7.0.0", "pillow==11.2.1", "tzdata==2025.2", "websockets==15.0.1",
  "python-docx==1.1.2",
]

[project.optional-dependencies]
desktop = [
  "pywebview==5.4", "sounddevice==0.5.2", "numpy==2.2.6",
  "faster-whisper==1.1.1", "webrtcvad-wheels==2.0.14", "mss==10.0.0",
  "requests==2.32.5",
  "pywin32==310; sys_platform == 'win32'", "pywinauto==0.6.9; sys_platform == 'win32'",
  "pycaw==20240210; sys_platform == 'win32'",
  "pynput==1.8.1; sys_platform == 'win32'", "keyring==25.6.0",
]
web = ["playwright==1.52.0"]
online = ["fish-audio-sdk==1.3.0"]
dev = ["pytest==8.3.5", "pytest-asyncio==0.26.0", "ruff==0.11.12"]

[project.scripts]
jarvis = "jarvis.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["jarvis"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
